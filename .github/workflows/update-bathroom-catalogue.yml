name: Update Pulse bathroom catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '50 2 * * *'
  push:
    paths:
      - 'scripts/update_bathroom_catalogue.py'
      - '.github/workflows/update-bathroom-catalogue.yml'

permissions:
  contents: write

concurrency:
  group: pulse-bathroom-catalogue
  cancel-in-progress: false

jobs:
  update-bathrooms:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify bathroom updater
        shell: bash
        run: |
          grep -q '2026-10-06-v1-pulse-bathrooms' scripts/update_bathroom_catalogue.py
          echo "Confirmed Pulse Bathrooms updater"
          grep 'BUSTERBUILD_BATHROOM_SYNC_VERSION' scripts/update_bathroom_catalogue.py | head -1

      - name: Install catalogue tools
        run: pip install --disable-pip-version-check requests beautifulsoup4

      - name: Build Pulse bathroom catalogue
        run: python -u scripts/update_bathroom_catalogue.py

      - name: Validate generated bathroom catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/pulse-bathroom-catalogue.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          products = d.get('products', [])
          groups = d.get('groups', {})

          print('Updater version:', d.get('updater_version'))
          print('Bathroom products:', len(products))
          print('Groups:', {k: v.get('count', 0) for k, v in groups.items()})
          print('Sync complete:', d.get('sync_complete'))
          print('Failed categories:', d.get('failed_categories', []))

          if d.get('updater_version') != '2026-10-06-v1-pulse-bathrooms':
              raise SystemExit('Wrong bathroom updater version generated the catalogue')

          if len(products) < 20:
              raise SystemExit('Generated bathroom catalogue is unexpectedly small')

          # BusterBuild pricing policy.
          bad = []
          for product in products:
              price = (product.get('price') or {}).get('current')
              if price is None:
                  continue
              if abs((float(price) % 1) - 0.99) > 0.001:
                  bad.append((product.get('name'), price))
                  if len(bad) >= 5:
                      break
          if bad:
              raise SystemExit(f'Bathroom prices not ending in .99: {bad}')
          PY

      - name: Save updated bathroom catalogue and cache
        run: |
          git config user.name "BusterBuild Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pulse-bathroom-catalogue.json data/pulse-bathroom-product-cache.json
          if git diff --cached --quiet; then
            echo "No bathroom catalogue changes."
          else
            git commit -m "Update Pulse bathroom catalogue"
            git push
          fi
