<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | BusterBuild Hardware</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- CONTACT HERO -->

<section class="page-banner">

    <div class="overlay"></div>

    <div class="banner-text">

        <h1>Contact Us</h1>

        <p>We're here to help with all your building and hardware needs.</p>

    </div>

</section>

<!-- CONTACT -->

<section class="contact-page">

    <div class="container">

        <div class="contact-grid">

            <div class="contact-info">

                <h2>Get In Touch</h2>

                <p><i class="fa-solid fa-location-dot"></i> CNR R558 & K1503 Road, Isixaxabesha Street Ext 6, Protea Glen, Soweto</p>

                <p><i class="fa-solid fa-phone"></i> +27 10 101 0424</p>

                <p><i class="fa-solid fa-envelope"></i> info@busterbuild.co.za</p>

                <p><i class="fa-solid fa-clock"></i> Monday - Friday: 08:00 - 17:00</p>

                <p><i class="fa-solid fa-clock"></i> Saturday: 08:00 - 14:00</p>

            </div>

            <div class="contact-form">

                <h2>Send Us a Message</h2>

                <form id="contactForm">

                    <input type="text" placeholder="Full Name" required>

                    <input type="email" placeholder="Email Address" required>

                    <input type="tel" placeholder="Phone Number">

                    <textarea placeholder="Your Message" rows="6" required></textarea>

                    <button type="submit" class="buy-btn">Send Message</button>

                </form>

            </div>

        </div>

    </div>

</section>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("contactForm");
    if (!form) return;
    form.addEventListener("submit", event => {
        event.preventDefault();
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }
        const button = form.querySelector('button[type="submit"]');
        if (button) {
            button.textContent = "Message Sent ✓";
            button.disabled = true;
        }
        form.reset();
        alert("Thank you. Your message has been received.");
    });
});
</script>
</body>

</html>
